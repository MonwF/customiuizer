apply plugin: 'com.android.application'
def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.isFile()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def lastVersion = 114
def lastVersionName = "r14.1.1-various"

android {
    namespace "name.monwf.customiuizer"
    signingConfigs {
        if (hasReleaseSigning) {
            v2 {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                v1SigningEnabled false
                v2SigningEnabled true
            }
        }
    }
    compileSdk 36
    defaultConfig {
        applicationId "name.monwf.customiuizer.r14"
        minSdkVersion 34
        //noinspection OldTargetApi,ExpiredTargetSdkVersion
        targetSdkVersion 34
        versionCode lastVersion
        versionName lastVersionName
        resConfigs 'ru-rRU', 'zh-rCN', 'zh-rTW', 'ja-rJP', 'vi-rVN', 'cs-rCZ', 'pt-rBR', 'tr-rTR', 'es-rES'
        ndk { abiFilters "arm64-v8a" }
    }
    def releaseSigning = hasReleaseSigning ? signingConfigs.v2 : null

    buildTypes {
        develop {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            crunchPngs true
            signingConfig releaseSigning ?: signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            signingConfig releaseSigning ?: signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += ['META-INF/*.kotlin_module', 'META-INF/androidx.*.version', '**.kotlin_builtins', '**.kotlin_metadata']
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            setProperty("outputFileName", "Pengeek-HyperOS1-A14-API101-${lastVersionName}.apk")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

dependencies {
    compileOnly files('lib/framework.jar')
    compileOnly "io.github.libxposed:api:101.0.1"

    implementation "io.github.libxposed:service:101.0.0"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.luckypray:dexkit:2.2.0'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.2.10"))
}
